[project]
name = "independent-rag-engine"
dynamic = ["version"]
description = "Modular, local-first RAG engine for reliable knowledge retrieval, evidence-grounded generation, and reproducible evaluation."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
]

[project.scripts]
rag = "rag_engine.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "import-linter>=2.0",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pip-licenses>=5.0",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-socket>=0.7",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/rag_engine/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "TID", "S", "DTZ"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -p no:cacheprovider --disable-socket --allow-unix-socket"
markers = [
    "unit: pure logic, no I/O, no network, no models",
    "contract: protocol contract tests run against implementations",
    "architecture: import-boundary checks (spawns a subprocess)",
    "integration: real SQLite and filesystem, no network",
    "e2e: whole command-line flows against a temporary workspace",
    "performance: measured acceptance thresholds",
]

[tool.coverage.run]
source = ["rag_engine"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "\\.\\.\\."]
