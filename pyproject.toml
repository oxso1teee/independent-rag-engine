[project]
name = "independent-rag-engine"
dynamic = ["version"]
description = "Modular, local-first RAG engine for reliable knowledge retrieval, evidence-grounded generation, and reproducible evaluation."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "charset-normalizer>=3.4",
    "filetype>=1.2",
    "httpx>=0.28,<1",
    "markdown-it-py>=4.0",
    "numpy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "selectolax>=1.0",
    "snowballstemmer>=3.0,<4",
    "structlog>=24.4",
    "typer>=0.15",
]

[project.optional-dependencies]
tokenizers = ["tokenizers>=0.20"]
pdf = [
    "pypdf>=7.1.1",
]
docx = [
    "python-docx>=1.2.0",
]
onnx = [
    "fastembed>=0.6,<1",
]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
]

[project.scripts]
rag = "rag_engine.container:main"

[dependency-groups]
dev = [
    "tokenizers>=0.20",
    "hypothesis>=6.100",
    "import-linter>=2.0",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pip-licenses>=5.0",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-socket>=0.7",
    "ruff>=0.8",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/rag_engine/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "eval"]
extend-exclude = ["tests/fixtures/corpus_mini"]  # generated documents must stay byte-exact

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "TID", "S", "DTZ"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PT018"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "eval"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["filetype", "filetype.*"]
ignore_missing_imports = true  # the library ships no type information

[[tool.mypy.overrides]]
module = ["snowballstemmer", "snowballstemmer.*"]
ignore_missing_imports = true  # the library ships no type information

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -p no:cacheprovider --disable-socket --allow-unix-socket"
markers = [
    "unit: pure logic, no I/O, no network, no models",
    "contract: protocol contract tests run against implementations",
    "architecture: import-boundary checks (spawns a subprocess)",
    "integration: real SQLite and filesystem, no network",
    "e2e: whole command-line flows against a temporary workspace",
    "api: the HTTP API through an in-process test client (needs the api extra)",
    "perf: measured budgets (NFR); not part of the pull-request CI, run with `make perf`",
    "chaos: failure injection, including SIGKILL at defined points",
    "integrity: data-model invariants and property-based model checks",
    "external: needs locally provisioned model files; skipped when they are absent",
]

[tool.coverage.run]
source = ["rag_engine"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "\\.\\.\\."]
