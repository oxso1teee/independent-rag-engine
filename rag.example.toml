# Copy to rag.toml (ignored by Git) and adjust. Environment variables prefixed with
# RAG_ override these values, e.g. RAG_LOGGING__LEVEL=DEBUG or RAG_LLM__CONTEXT_WINDOW=8192.

# Resource profile. Only "low" is supported at the moment.
profile = "low"

# Explicit overrides of the profile's limits (all optional).
[limits]
# llm_concurrency = 1
# embed_concurrency = 1
# embed_batch = 16
# ingest_workers = 1
# max_loaded_vectors_mb = 512

[storage]
db_path = "data/rag.db"

# Retry and lease behaviour of the ingestion job queue (all optional).
[ingest]
# max_attempts = 5
# retry_base_delay_s = 30
# retry_factor = 2
# retry_max_delay_s = 3600
# retry_jitter = 0.2        # share of a delay that may be randomly shortened
# lease_s = 300

# Enable embedding to have `rag ingest` process its queue and publish searchable versions.
# Pin the installed model digest, dimension and input limit; a mismatch stops publication.
[embedding]
enabled = false
# provider = "ollama"  # or "onnx" with model_dir set to local model files
# model = "your-embedding-model"
# revision = "installed-model-sha256-digest"
# dimension = 1024
# max_input_tokens = 8192
# base_url = "http://127.0.0.1:11434"
# model_dir = "/path/to/local/onnx/model"

# Limits applied to every document; exceeding one is an error, never a silent truncation.
[parsing]
# max_text_chars = 20000000
# max_blocks = 200000
# max_pages = 2000
# max_archive_mb = 200
# max_archive_ratio = 100
# timeout_s = 60
# isolate = ["pdf", "docx", "html"]   # formats parsed in a separate worker process
# isolation_memory_mb = 1024         # worker data-segment cap (plan 250 MB + 14 MB per million characters); isolate = [] disables isolation

# Chunk size policy (tokens), strategy and token counter.
[chunking]
# target_tokens = 256
# max_tokens = 384
# min_tokens = 48
# overlap_ratio = 0.12
# strategy = "auto"               # auto picks by document structure; or structure_aware, recursive, fixed
# counter = "heuristic"           # or "tokenizers" together with tokenizer_json
# tokenizer_json = "models/tokenizer.json"

[llm]
enabled = false
# provider = "local"
# model = "your-chat-model"
# context_window = 8192
# max_new_tokens = 512
# api_key_env = "RAG_LLM_API_KEY"   # name of the environment variable holding the key

[logging]
level = "INFO"
json_output = true
