# Copy to rag.toml (ignored by Git) and adjust. Environment variables prefixed with
# RAG_ override these values, e.g. RAG_LOGGING__LEVEL=DEBUG or RAG_LLM__CONTEXT_WINDOW=8192.

# Resource profile. Only "low" is supported at the moment.
profile = "low"

# Explicit overrides of the profile's limits (all optional).
[limits]
# llm_concurrency = 1
# embed_concurrency = 1
# embed_batch = 16
# ingest_workers = 1
# max_loaded_vectors_mb = 512

[storage]
db_path = "data/rag.db"

# Retry and lease behaviour of the ingestion job queue (all optional).
[ingest]
# max_attempts = 5
# retry_base_delay_s = 30
# retry_factor = 2
# retry_max_delay_s = 3600
# retry_jitter = 0.2        # share of a delay that may be randomly shortened
# lease_s = 300
# keep_versions = 3      # complete versions retained per document

# Enable embedding to have `rag ingest` process its queue and publish searchable versions.
# Pin the installed model digest, dimension and input limit; a mismatch stops publication.
[embedding]
enabled = false
# provider = "ollama"  # or "onnx" with model_dir set to local model files
# model = "your-embedding-model"
# revision = "installed-model-sha256-digest"
# dimension = 1024
# max_input_tokens = 8192
# base_url = "http://127.0.0.1:11434"
# model_dir = "/path/to/local/onnx/model"
# ONNX (extra `onnx`): `revision` is the fingerprint of every file in model_dir, not an upstream id:
#   uv run python -c "from pathlib import Path; from rag_engine.embedding.onnx import \
#   model_directory_digest as d; print(d(Path('/path/to/local/onnx/model')))"
# multilingual-e5-small needs: dimension = 384, max_input_tokens = 512,
#   query_prefix = "query: ", document_prefix = "passage: "

# Search defaults. `dense` stays the default until an evaluation shows hybrid is not worse.
[retrieval]
# mode = "dense"           # dense, lexical or hybrid
# top_k = 8                # results returned (1-100)
# candidate_k = 40         # candidates per channel (top_k <= candidate_k <= 500)
# max_per_document = 3     # cap on chunks from one document; unset means no cap
# query_max_tokens = 256   # a longer query is refused, never truncated
# fusion = "rrf"           # rrf or weighted
# rrf_k = 60
# dense_weight = 1.0
# lexical_weight = 0.5
# alpha = 0.5              # weight of the dense score when fusion = "weighted"

# Optional cross-encoder reranking. Off by default (ADR 0014); the files are provisioned by hand.
[rerank]
# enabled = false
# model = "BAAI/bge-reranker-v2-m3-int8"
# model_dir = "/path/to/local/reranker"
# revision = "<fingerprint of model_dir, as for the embedding model>"
# pool_size = 30          # candidates reranked; the result is cut to top_k afterwards
# timeout_s = 10.0        # a slower call falls back to the fused order
# batch_size = 8
# max_pair_tokens = 512   # a longer query + passage pair is refused, never cut

# How retrieved chunks become the evidence of an answer (`rag context`).
[context]
# max_chunks_per_document = 3
# order = "by_score"      # or "by_document_order"
# small_to_big = false    # replace a retrieved chunk by its section when it fits
# min_evidence_items = 1
# item_overhead_tokens = 8

# Limits applied to every document; exceeding one is an error, never a silent truncation.
[parsing]
# max_text_chars = 20000000
# max_blocks = 200000
# max_pages = 2000
# max_archive_mb = 200
# max_archive_ratio = 100
# timeout_s = 60
# isolate = ["pdf", "docx", "html"]   # formats parsed in a separate worker process
# isolation_memory_mb = 1024         # worker data-segment cap (plan 250 MB + 14 MB per million characters); isolate = [] disables isolation

# Chunk size policy (tokens), strategy and token counter.
[chunking]
# target_tokens = 256
# max_tokens = 384
# min_tokens = 48
# overlap_ratio = 0.12
# strategy = "auto"               # auto picks by document structure; or structure_aware, recursive, fixed
# counter = "heuristic"           # or "tokenizers" together with tokenizer_json
# tokenizer_json = "models/tokenizer.json"

[llm]
enabled = false
# provider = "local"
# model = "your-chat-model"
# context_window = 8192
# max_new_tokens = 512
# api_key_env = "RAG_LLM_API_KEY"   # name of the environment variable holding the key

[logging]
level = "INFO"
json_output = true
