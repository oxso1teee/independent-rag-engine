name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  quality:
    name: Lint, types, architecture, tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lock file is up to date
        run: uv lock --check
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Import boundaries
        run: uv run lint-imports
      - name: Tests with coverage (no network)
        run: uv run pytest -m "not perf" --cov=rag_engine --cov-report=term-missing
      - name: Domain coverage gate (>= 90 %)
        run: uv run coverage report --include="src/rag_engine/domain/*" --fail-under=90

  compatibility:
    name: Tests (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run pytest -q -m "not perf"

  supply-chain:
    name: Licenses and vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          python-version: "3.12"
      - name: Install tooling and runtime-only environment
        run: |
          uv sync --frozen
          UV_PROJECT_ENVIRONMENT=.venv-runtime uv sync --frozen --no-dev
      - name: Dependency licenses (runtime)
        run: >
          uv run pip-licenses --python .venv-runtime/bin/python
          --ignore-packages independent-rag-engine
          --partial-match --fail-on="GPL;AGPL;SSPL;Proprietary;Non-Commercial;UNKNOWN"
          --format=plain
      - name: Third-party notices and SBOM are current
        run: uv run python scripts/generate_notices.py --check
      - name: Package builds and installs without extras
        run: scripts/package_smoke.sh
      - name: Known vulnerabilities
        run: |
          uv export --frozen --all-groups --no-emit-project --format requirements-txt -o requirements-audit.txt
          uv run pip-audit -r requirements-audit.txt --disable-pip --no-deps

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Build
        run: docker build -t rag-engine:smoke .
      - name: Smoke test (token, user, health, size)
        run: scripts/docker_smoke.sh rag-engine:smoke

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read  # gitleaks lists the commits of a pull request through the API
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
